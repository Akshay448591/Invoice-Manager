version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: invoice-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/invoice
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_EXPIRES_IN=7d
      - COOKIE_SAME_SITE=lax
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - invoice-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: invoice-manager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - invoice-network

  mongo:
    image: mongo:6.0
    container_name: invoice-manager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - invoice-network

volumes:
  mongo-data:

networks:
  invoice-network:
    driver: bridge
